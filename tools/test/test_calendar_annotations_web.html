<!doctype html>
<meta charset="utf-8">
<title>Calendar annotation web tests</title>
<body data-result="RUNNING">
  <input id="calendarAnnotationDate" type="date">
  <input id="calendarAnnotationLabel" type="text">
  <select id="calendarAnnotationFontSize">
    <option value="0">follow</option><option value="9">small</option><option value="12">large</option>
  </select>
  <select id="calendarAnnotationColor">
    <option value="0">black</option><option value="1">white</option><option value="2">red</option>
  </select>
  <span id="calendarAnnotationLabelHint"></span>
  <span id="calendarAnnotationCount"></span>
  <table><tbody id="calendarAnnotationsList"></tbody></table>
  <pre id="testOutput"></pre>
  <script src="../../html/js/resource_bundle.js"></script>
  <script src="../../html/js/resource_manager.js"></script>
  <script src="../../html/js/calendar_annotations.js"></script>
  <script>
    window.addLog = function () {};
    window.showToast = function () {};

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    window.addEventListener('load', async function () {
      const output = document.getElementById('testOutput');
      try {
        const coverage = CalendarAnnotations.getFontCoverage();
        assert(coverage.get(9).size === 228, 'unexpected 9px coverage');
        assert(coverage.get(12).size === 142, 'unexpected 12px coverage');
        assert(CalendarAnnotations.analyzeLabel('休').missing.length === 0,
          'built-in glyph was reported missing');
        assert(CalendarAnnotations.analyzeLabel('会议').missing.length === 4,
          'missing glyph variants were not detected');
        assert(CalendarAnnotations.analyzeLabel('会议', 12).missing.length === 2,
          'selected font size did not limit fallback variants');
        assert(CalendarAnnotations.analyzeLabel('😀').unsupported.length === 1,
          'non-BMP emoji was not rejected');
        assert(CalendarAnnotations.normalizeColor(undefined) === CalendarAnnotations.COLOR_BLACK,
          'annotation default color must be black');

        const input = document.getElementById('calendarAnnotationLabel');
        input.value = '会议';
        CalendarAnnotations.updateLabelHint();
        assert(document.getElementById('calendarAnnotationLabelHint').textContent.includes('保存时同步点阵'),
          'live missing-glyph hint absent');

        const normalized9 = CalendarAnnotations.rasterizeGlyph('息', 9);
        const normalized12 = CalendarAnnotations.rasterizeGlyph('息', 12);
        assert(normalized9.width === 12 && normalized9.height === 11 &&
               normalized9.advance === 13 && normalized9.yOffset === -10,
          'WQY9 CJK glyph was not normalized to the decoded lunar font cell');
        assert(normalized12.width === 16 && normalized12.height === 16 &&
               normalized12.advance === 17 && normalized12.yOffset === -14,
          'WQY12 CJK glyph was not normalized to the decoded lunar font cell');

        CalendarAnnotations.annotations = [
          { year: 2026, month: 8, day: 8, key: '2026-08-08', label: '会议', fontSize: 12, color: 2 }
        ];
        const encoded = CalendarAnnotations.encode();
        const view = new DataView(encoded.bytes.buffer);
        assert(encoded.glyphCount === 2, 'selected-size glyph variants were not deduplicated');
        assert(encoded.bytes[8] === CalendarAnnotations.GLYPH_FORMAT, 'glyph extension missing');
        assert(view.getUint16(10, true) === 2, 'glyph count header mismatch');
        assert(encoded.bytes[CalendarAnnotations.HEADER_SIZE + 4] === 21,
          'large font mode and red color were not encoded in record flags');
        CalendarAnnotations.decode(encoded.bytes);
        assert(CalendarAnnotations.annotations.length === 1 &&
               CalendarAnnotations.annotations[0].label === '会议' &&
               CalendarAnnotations.annotations[0].fontSize === 12 &&
               CalendarAnnotations.annotations[0].color === 2,
               'ANNO font-size/color round trip failed');

        let refreshMode = 'not-called';
        window.EpdCmd = { SET_TIME: 0x20 };
        window.getEstimatedRefreshSeconds = function () { return 0; };
        window.buildTimeData = function (mode) {
          refreshMode = mode;
          return new Uint8Array([0, 0, 0, 0, 8]);
        };
        window.write = async function (command, payload) {
          assert(command === window.EpdCmd.SET_TIME && payload.length === 5,
            'annotation refresh must send SET_TIME without a display mode byte');
          return true;
        };
        window.deviceDisplayMode = 2;
        await CalendarAnnotations.refreshCalendar();
        assert(refreshMode === null, 'annotation refresh must preserve device display mode');

        let updateCalls = 0;
        ResourceManager.deviceEntries = null;
        ResourceManager.isConnected = function () { return true; };
        CalendarAnnotations.ensureDeviceEntries = async function () {
          ResourceManager.deviceEntries = ResourceManager.getBundle().entries;
          return ResourceManager.deviceEntries;
        };
        ResourceManager.determineSafeOffset = async function () { return 0x19000; };
        ResourceManager.updateResources = async function (target, data) {
          updateCalls++;
          assert(target.type === 7 && target.id === 1, 'wrong resource target');
          assert(data[8] === CalendarAnnotations.GLYPH_FORMAT, 'save dropped glyph extension');
          return true;
        };
        CalendarAnnotations.refreshCalendar = async function () {};
        await CalendarAnnotations.save();
        assert(updateCalls === 1, 'save must use a single resource commit');
        assert(CalendarAnnotations.annotations[0].label === '会议',
          'save manifest check overwrote local annotations');

        document.body.dataset.result = 'PASS';
        output.textContent = 'calendar annotations web: OK';
      } catch (error) {
        document.body.dataset.result = 'FAIL';
        output.textContent = error.stack || error.message || String(error);
      }
    });
  </script>
</body>
